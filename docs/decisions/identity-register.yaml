# Identity register (ADR-002).
#
# The single exception to the fail-closed identity gate. Every entry is an exact
# path pinned by content digest and occurrence count, naming its owner, the
# rationale, and the condition that retires it. The gate fails closed on any
# drift. There are no globs, path prefixes, or directory exemptions, and an entry
# never excuses retired identity in current, owned guidance.
#
# Two record classes, deliberately distinct:
#
#   external-identity  A live identity this repository provably does not own --
#                      an immutable key in another system, or a contract emitted
#                      by a shared workflow. This is a debt: it carries a real
#                      retiring condition, and when that condition is met the
#                      entry is deleted, not amended.
#
#   historical-record  A decision superseded by ADR-002 and retained unchanged
#                      because it accurately records what was decided at the
#                      time. This is an asset: permanent, and the retained
#                      document must say plainly that it is history, not current
#                      guidance. Deleting it to clear a scan would destroy the
#                      record ADR-000 promised to keep.
#
# Re-pin an entry with `tools/check_identity_policy.py --update` when a
# registered file changes for an unrelated reason. That flag cannot add an entry;
# granting a new exception is a reviewed edit to this file.
entries:
  - path: .ground-control.yaml
    digest: 4a3a38097470d025ee82162bc198e9c04572ab0c2a52d595642af09b24afd79d
    record_class: external-identity
    owner: ground-control
    rationale: >-
      immutable Ground Control project key; PUT /api/v1/projects/{id} updates only name and description
    occurrences: 1
    retires_when: >-
      Ground Control offers a project-identifier migration
  - path: Makefile
    digest: d2b9e787116d9d6458648202610e036a95fb6898581c3c85e73f6ef1ef310ab9
    record_class: external-identity
    owner: ground-control
    rationale: >-
      requirement-governance environment variable emitted by the Ground Control workflow constant; renaming it here alone would leave the gate reading a variable the workflow never sets
    occurrences: 1
    retires_when: >-
      autarchy-ai/Ground-Control#1471 renames the requirement-governance variable across its four consuming repositories
