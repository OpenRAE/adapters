# The `raes-adapters` distribution.
#
# `raes-adapters` is this repository's single published PyPI distribution. It
# ships shared adapter plumbing (`raes_adapters.base`) plus one module per
# simulator backend (`raes_adapters.cyborg`, ...). Simulator-specific
# dependencies are optional extras: `pip install raes-adapters[cyborg]`.
#
# Packaging boundary (RAES ADR-069 as amended — RAESystem/rae#949 — and ADR-003):
# RAES owns the contracts an adapter must honor, not this repo's packaging. This
# repository deliberately uses ONE distribution + optional per-simulator extras
# rather than a per-adapter monorepo. When a second simulator with a
# mutually-incompatible stack lands, its extra is isolated from cyborg's with
# uv's `conflicts` declaration so neither gates the other in the single lock.
[project]
name = "raes-adapters"
# Release Please owns this version (release-type "python"); it bumps it from
# Conventional Commit history on `main`. 0.0.0 is the unreleased baseline; the
# first release cuts 0.1.0.
version = "0.0.0"
description = "RAES simulator adapters: shared plumbing plus optional per-simulator backends."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RAES" }]
keywords = ["raes", "simulator", "adapter", "cyborg", "cage-2", "cyber-defense"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["raes==3.3.0"]

[project.optional-dependencies]
# Microsoft publishes the selected CyberBattleSim source but no index or
# release artifact. The adapter extra is therefore dependency-light; users
# install the pinned simulator source separately and target construction
# reports its absence without weakening the base installation.
cyberbattlesim = []
# DSTL publishes the selected PrimAITE source (tag v4.0.0) but no index or
# release wheel. Its pins (gymnasium==0.28.1, numpy~=1.23, pydantic==2.7.0) are
# mutually incompatible with the resolved cyberbattlesim/base graph, so the
# adapter extra is dependency-light: users install the pinned source separately
# and keep those pins out of the single lock. No uv `conflicts` declaration is
# needed while the extra is empty.
primaite = []
# The environment-pack validator is installable. The native backend remains on
# the documented source-install route because the official CybORG wheel still
# lacks the qualified packaging-data fix; the command reports that limitation
# instead of cloning source or advertising an ungoverned wheel.
cyborg = ["raes-env-packs==3.6.2"]
# NASim publishes an index distribution, so the extra pins it directly, together
# with the qualified runtime (gymnasium 0.26.3 / numpy 1.26.4) so that installing
# the extra reproduces the admitted, runnable protocol rather than a newer
# gymnasium that breaks NASim's supplied agents (they assert a Python-int action
# index, which gymnasium >= 0.27 returns as numpy.int64). See the qualification
# record (src/raes_adapters/nasim/qualification.json). No `conflicts` entry is
# needed — no other extra constrains gymnasium/numpy in the single lock.
nasim = ["nasim==0.12.0", "gymnasium==0.26.3", "numpy==1.26.4"]

[project.scripts]
raes-adapters = "raes_adapters.cli:main"

[project.urls]
Homepage = "https://github.com/OpenRAE/adapters"
Documentation = "https://raes-adapters.readthedocs.io"
Repository = "https://github.com/OpenRAE/adapters"
Issues = "https://github.com/OpenRAE/adapters/issues"
Changelog = "https://github.com/OpenRAE/adapters/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raes_adapters"]

[tool.hatch.build.targets.sdist]
include = ["src/raes_adapters", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
# One lock for the whole distribution. `raes-adapters` builds an artifact, so it
# is not a virtual project.
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "ruff>=0.10",
    "pre-commit>=4.0",
    "pre-commit-hooks>=5.0",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/.venv", "**/build", "**/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/raes_adapters/_experiment_evidence.py" = ["UP004"]
"src/raes_adapters/_gym_backend/conformance.py" = ["UP004"]
"src/raes_adapters/_gym_backend/orchestrator.py" = ["UP004"]
"src/raes_adapters/_gym_backend/provisioner.py" = ["UP004"]
"src/raes_adapters/_gym_backend/evaluator.py" = ["UP004"]
"src/raes_adapters/_gym_backend/participant_runtime.py" = ["UP004"]
"src/raes_adapters/cyberbattlesim/backend/driver.py" = ["UP004"]
"src/raes_adapters/cyberbattlesim/backend/evaluator.py" = ["UP004"]
"src/raes_adapters/cyberbattlesim/backend/orchestrator.py" = ["UP004"]
"src/raes_adapters/cyberbattlesim/backend/provisioner.py" = ["UP004"]
"src/raes_adapters/nasim/backend/driver.py" = ["UP004"]
"src/raes_adapters/nasim/backend/evaluator.py" = ["UP004"]
"src/raes_adapters/nasim/backend/orchestrator.py" = ["UP004"]
"src/raes_adapters/nasim/backend/provisioner.py" = ["UP004"]
"src/raes_adapters/cli.py" = ["UP004"]
"src/raes_adapters/cyborg/orchestrator.py" = ["UP004"]
"src/raes_adapters/cyborg/conformance.py" = ["UP004"]
"src/raes_adapters/cyborg/researcher.py" = ["UP004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["raes_adapters"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Defensive fallback taken only when the distribution metadata is absent
    # (importing from a source tree that was never installed); unreachable while
    # the package is installed, as it always is under test.
    "except PackageNotFoundError:",
]
