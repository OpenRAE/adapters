# SonarCloud Configuration for aces-adapters
# https://sonarcloud.io/project/overview?id=Brad-Edwards_aces-adapters

sonar.projectKey=Brad-Edwards_aces-adapters
sonar.organization=brad-edwards

# Strict quality gate (REP-002): make the scanner wait for the SonarCloud
# quality gate and fail the CI `sonar` job when the gate fails, so nothing
# merges past a failing gate. The assigned gate mirrors the aces `aces-strict`
# gate: fails on ANY new issue, plus new-code rating / coverage / duplication /
# security-hotspot conditions. Configure the `aces-adapters-strict` gate in the
# SonarCloud org and assign it to this project.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Per-adapter monorepo (ADR-069 §5): sources and tests are the union of the
# independent adapter packages. Add a new adapter's src/ + tests/ here when it
# lands.
sonar.sources=packages/sim_adapter_base/src,packages/cyborg_adapter/src
sonar.tests=packages/sim_adapter_base/tests,packages/cyborg_adapter/tests

# Each adapter is tested in its own isolated environment and emits its own
# coverage report; SonarCloud aggregates them.
sonar.python.coverage.reportPaths=packages/sim_adapter_base/coverage.xml,packages/cyborg_adapter/coverage.xml

sonar.python.version=3.12

sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**
