# SonarCloud Configuration for RAES Adapters
# https://sonarcloud.io/project/overview?id=RAESystem_adapters

sonar.projectKey=RAESystem_adapters
sonar.organization=brad-edwards
sonar.projectName=RAES Adapters

# Strict quality gate (REP-002): make the scanner wait for the SonarCloud
# quality gate and fail the CI `sonar` job when the gate fails, so nothing
# merges past a failing gate. The assigned gate mirrors the raes
# `raes-adapters-strict` gate: fails on ANY new issue, plus new-code rating /
# coverage / duplication / security-hotspot conditions. The project is assigned
# to the `raes-adapters-strict` gate in SonarCloud.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Single distribution `raes-adapters` (ADR-003): shared base plumbing plus
# per-simulator modules under one import package, so sources and tests are single
# trees and a single aggregated coverage report.
sonar.sources=src
sonar.tests=tests

sonar.python.coverage.reportPaths=coverage.xml

sonar.python.version=3.12

sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**
