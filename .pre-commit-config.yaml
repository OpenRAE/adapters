fail_fast: true
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: nox-pre-commit
        name: nox pre-commit gate
        entry: make precommit
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
      - id: nox-pre-push
        name: nox pre-push verify
        entry: make prepush
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
