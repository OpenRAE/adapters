schema_version: environment-pack-compatibility/v2
pack:
  name: nasim-tiny
  title: NASim tiny researcher example
  version: 1.0.0
  status: built
  provenance_ledger: docs/provenance-ledger.yaml
  source:
    requirement: null
    issues:
      - 36
    upstream_references:
      - https://github.com/Jjschwartz/NetworkAttackSimulator
artifact_boundaries:
  participant_visible:
    - path: sdl
      export: public
      description: Portable RAES SDL scenario (topology and objective truth).
    - path: experiment
      export: public
      description: Published experiment authoring input and evaluation task.
    - path: docs/attack-path.md
      export: public
      description: Participant-safe narrative attack path.
    - path: docs/concepts.md
      export: public
      description: Participant-safe concept overview.
  operator_only:
    - path: participant
      export: operator
      description: Red bruteforce participant manifest, selection, and configuration.
    - path: docs/provenance-ledger.yaml
      export: operator
      description: Pack-domain provenance, licensing, and safety ledger.
    - path: docs/golden-readiness-checklist.md
      export: operator
      description: Operator golden-readiness review checklist.
  oracle_only: []
  commercial: []
runtime_profiles:
  - profile_id: nasim-tiny-static-benchmark
    status: supported
    description: >-
      The admitted NASim tiny static benchmark realized node-for-node by the
      nasim-tiny backend with the pinned qualified runtime.
    provider: raes-adapters[nasim]
delivery_bundles: []
platform_features: []
assets:
  - asset_id: portable-scenario
    path: sdl/nasim-tiny.sdl.yaml
    visibility: public
    status: shipped
    description: Portable RAES SDL scenario document.
  - asset_id: experiment-task
    path: experiment/nasim-tiny.task.exp.json
    visibility: public
    status: shipped
    description: Published evaluation-task contract.
  - asset_id: experiment-spec
    path: experiment/nasim-tiny.spec.exp.json
    visibility: public
    status: shipped
    description: Published experiment authoring-input contract.
operator_surfaces:
  - surface_id: red-participant-selection
    path: participant/nasim-red-bruteforce.selection.json
    role: participant-selection
    visibility: operator
    status: shipped
    description: Red bruteforce participant selection binding.
validation:
  commands:
    - id: pack-validate
      command: raes-pack-validate --pack .
      validates:
        - sdl/nasim-tiny.sdl.yaml
        - docs/provenance-ledger.yaml
        - pack.compatibility.yaml
    - id: pack-release-check
      command: raes-pack-release check --pack .
      validates:
        - pack.compatibility.yaml
  gates:
    - id: sdl-through-raes
      kind: schema
      paths:
        - path: sdl/nasim-tiny.sdl.yaml
    - id: participant-leak-scan
      kind: leak-scan
      paths:
        - path: docs/attack-path.md
        - path: docs/concepts.md
    - id: golden-walkthrough
      kind: manual-walkthrough
      paths:
        - path: docs/golden-readiness-checklist.md
