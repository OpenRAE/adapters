name: cage2-research
version: "1.0.0"
description: >-
  Portable RAES model of the qualified CAGE Challenge 2 Scenario2 case
  (cage-challenge/cage-challenge-2 @ 26ce1c1). It declares the fixed User,
  Enterprise, and Operational networks; the thirteen source hosts and their
  qualified image-derived service intent; credential-free synthetic participant
  accounts; distinct Blue, Green, and Red roles; participant action and
  observation boundaries; and operational-service objective truth. Native
  images, sessions, addresses, observations, hidden state, action ids, reward
  vectors, and logs remain private to the CybORG adapter. Reward definitions,
  trial cutoffs, red-policy variants, seeds, and derived measures remain in the
  companion experiment contracts. The recorded User3 service-port mismatch is
  retained as source-authored and remains loss-disclosed by the source ledger.

module:
  id: openrae/cyborg-cage2-scenario2
  version: "1.0.0"
  description: "Qualified portable CAGE-2 Scenario2 module for the CybORG adapter."

vulnerabilities:
  weak-credential:
    name: "Bruteforceable local account"
    description: >-
      The selected source image declares a local account as bruteforceable;
      credential material is deliberately not carried into this document.
    class: "CWE-521"
    technical: true
  remote-file-inclusion:
    name: "Remote file inclusion on an image-defined web service"
    description: >-
      The selected source image marks its web service with remote-file-inclusion
      behavior used by the source exploitation actions.
    class: "CWE-98"
    technical: true

infrastructure:
  user:
    count: 1
    description: "CAGE-2 User subnet containing five user workstations."
  enterprise:
    count: 1
    description: "CAGE-2 Enterprise subnet containing three servers and the defender host."
  operational:
    count: 1
    description: "Critical CAGE-2 Operational subnet containing three hosts and the OT server."
    acls:
      - name: deny-user-inbound
        direction: in
        from_net: user
        to_net: operational
        protocol: any
        action: deny
        description: "The source Operational NACL denies inbound traffic from User."
  defender: {count: 1, links: [enterprise]}
  enterprise-0: {count: 1, links: [enterprise]}
  enterprise-1: {count: 1, links: [enterprise]}
  enterprise-2: {count: 1, links: [enterprise]}
  op-host-0: {count: 1, links: [operational]}
  op-host-1: {count: 1, links: [operational]}
  op-host-2: {count: 1, links: [operational]}
  op-server-0: {count: 1, links: [operational]}
  user-0: {count: 1, links: [user]}
  user-1: {count: 1, links: [user]}
  user-2: {count: 1, links: [user]}
  user-3: {count: 1, links: [user]}
  user-4: {count: 1, links: [user]}

