action_contracts:
  sleep:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "No-op participant turn."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Portable no-effect action projected by the selected backend."
    preconditions:
      - {precondition_id: pre-participant-active, precondition_class: capability, description: "The participant is active for the current turn."}
    effects:
      - {effect_id: eff-sleep, effect_class: no_effect, description: "No intended state change."}
    failure_classes: [unsupported_action]
  monitor:
    semantic_version: "1.0.0"
    behavioral_granularity: procedure
    procedure_basis: "CAGE-2 Blue monitoring intent over endpoint telemetry."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of monitoring intent."
    preconditions:
      - {precondition_id: pre-blue-monitor, precondition_class: authority, description: "Blue has monitoring authority."}
    effects:
      - {effect_id: eff-monitor, effect_class: observation_effect, description: "Blue receives a bounded monitoring observation.", target_refs: [defender]}
    failure_classes: [authority_denied, unsupported_action]
  analyse:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Blue host-analysis intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of host analysis."
    preconditions:
      - {precondition_id: pre-analyse-host, precondition_class: target, description: "The target host is in Blue operating scope."}
    effects:
      - {effect_id: eff-analyse, effect_class: observation_effect, description: "Blue receives bounded host-analysis evidence.", target_refs: [user-0]}
    failure_classes: [target_unavailable, authority_denied]
  remove:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Blue suspicious-process removal intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Loss-disclosed portable projection of source removal behavior."
    preconditions:
      - {precondition_id: pre-remove-host, precondition_class: authority, description: "Blue may remediate the target host."}
    effects:
      - {effect_id: eff-remove, effect_class: intended_effect, description: "A detected suspicious process is removed when supported.", target_refs: [user-0]}
    failure_classes: [target_unavailable, unsupported_action]
  deploy-decoy:
    semantic_version: "1.0.0"
    behavioral_granularity: procedure
    procedure_basis: "CAGE-2 Blue decoy-service deployment intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Portable grouping of the source-defined Blue decoy actions."
    preconditions:
      - {precondition_id: pre-decoy-host, precondition_class: authority, description: "Blue may deploy a decoy on the target host."}
    effects:
      - {effect_id: eff-decoy, effect_class: intended_effect, description: "A selected decoy service is deployed on the target host.", target_refs: [user-0]}
    failure_classes: [target_unavailable, authority_denied, unsupported_action]
  restore:
    semantic_version: "1.0.0"
    behavioral_granularity: procedure
    procedure_basis: "CAGE-2 Blue host-restoration intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of source host restoration."
    preconditions:
      - {precondition_id: pre-restore-host, precondition_class: authority, description: "Blue may restore the target host."}
    effects:
      - {effect_id: eff-restore, effect_class: intended_effect, description: "The target host is restored to its selected image state.", target_refs: [user-0]}
    failure_classes: [target_unavailable, authority_denied]
  green-ping-sweep:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Green reachability activity."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of legitimate reachability activity."
    preconditions:
      - {precondition_id: pre-green-active, precondition_class: capability, description: "Green is active on a declared host."}
    effects:
      - {effect_id: eff-green-ping, effect_class: observation_effect, description: "Green observes reachable systems.", target_refs: [user]}
    failure_classes: [target_unavailable]
  green-port-scan:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Green service-discovery activity."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of legitimate port activity."
    preconditions:
      - {precondition_id: pre-green-host, precondition_class: authority, description: "Green holds a declared host session."}
    effects:
      - {effect_id: eff-green-scan, effect_class: observation_effect, description: "Green observes available services.", target_refs: [user-0]}
    failure_classes: [target_unavailable]
  green-connection:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Green legitimate connection activity."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of legitimate service use."
    preconditions:
      - {precondition_id: pre-green-service, precondition_class: target, description: "A declared service is reachable from Green's host."}
    effects:
      - {effect_id: eff-green-connect, effect_class: intended_effect, description: "Green exercises an available service.", target_refs: [user-0]}
    failure_classes: [target_unavailable]
  discover-remote-systems:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Red remote-system discovery intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of network discovery."
    preconditions:
      - {precondition_id: pre-red-foothold, precondition_class: authority, description: "Red holds its declared foothold."}
    effects:
      - {effect_id: eff-discover-hosts, effect_class: observation_effect, description: "Reachable system identities may become visible to Red.", target_refs: [user]}
    failure_classes: [target_unavailable]
  discover-network-services:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Red network-service discovery intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of service discovery."
    preconditions:
      - {precondition_id: pre-known-host, precondition_class: knowledge, description: "Red knows the target host."}
    effects:
      - {effect_id: eff-discover-services, effect_class: observation_effect, description: "Visible target services may become known to Red.", target_refs: [enterprise-1]}
    failure_classes: [target_unavailable]
  exploit-remote-service:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Red remote-service exploitation intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of source exploitation behavior."
    preconditions:
      - {precondition_id: pre-service-known, precondition_class: knowledge, description: "Red knows a reachable target service."}
    effects:
      - {effect_id: eff-exploit, effect_class: intended_effect, description: "Successful exploitation establishes target access.", target_refs: [enterprise-1]}
    failure_classes: [target_unavailable, authority_denied]
  privilege-escalate:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Red privilege-escalation intent."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of source privilege escalation."
    preconditions:
      - {precondition_id: pre-session, precondition_class: authority, description: "Red has an admitted session on the target."}
    effects:
      - {effect_id: eff-escalate, effect_class: intended_effect, description: "Successful escalation increases target authority.", target_refs: [enterprise-1]}
    failure_classes: [target_unavailable, authority_denied]
  impact:
    semantic_version: "1.0.0"
    behavioral_granularity: atomic
    procedure_basis: "CAGE-2 Red impact intent against the operational service."
    realization_profile: "portable-scenario/v1"
    fidelity_claim: "Abstract portable projection of operational-service impact."
    preconditions:
      - {precondition_id: pre-op-authority, precondition_class: authority, description: "Red has sufficient authority on the operational server."}
    effects:
      - effect_id: eff-impact
        effect_class: intended_effect
        description: "The operational service becomes unavailable."
        target_refs: [op-server-0]
    failure_classes: [target_unavailable, authority_denied]

observation_boundaries:
  blue:
    projection_basis: "Blue source-defined initial knowledge and monitoring view."
    observable_refs: [user, enterprise, operational, defender, enterprise-0, enterprise-1, enterprise-2, op-host-0, op-host-1, op-host-2, op-server-0, user-0, user-1, user-2, user-3, user-4]
    redaction_policy: "Native observations, sessions, processes, connections, and hidden state stay backend-private."
    latency_profile: "per-turn"
  green:
    projection_basis: "Green source-defined workstation and operational-host view."
    observable_refs: [user, enterprise, operational, defender, enterprise-0, enterprise-1, enterprise-2, op-host-0, op-host-1, op-host-2, op-server-0, user-0, user-1, user-2, user-3, user-4]
    redaction_policy: "Native observations, actions, and connection payloads stay backend-private."
    latency_profile: "per-turn"
  red:
    projection_basis: "Red source-defined initial foothold view."
    observable_refs: [user, user-0]
    hidden_refs: [enterprise, operational, defender, enterprise-0, enterprise-1, enterprise-2, op-host-0, op-host-1, op-host-2, op-server-0, user-1, user-2, user-3, user-4]
    redaction_policy: "Only admitted participant-relative references cross the adapter boundary."
    latency_profile: "per-turn"

propositions:
  operational-service-available:
    description: "The critical OT service has no projected Blue availability penalty."
    subjects: [op-server-0]
    basis: observed_state
    predicate:
      kind: number
      property: availability
      semantic_ref: "urn:raes:cage2:blue-availability-component"
      operator: equals
      expected: 0.0
      unit: reward_component
      unit_semantic_ref: "urn:raes:cage2:reward-component"
    evidence_requirements: [operational-service-state]

assertions:
  operational-service-invariant:
    description: "The critical operational service remains available."
    proposition: operational-service-available
    role: invariant
    polarity: positive
  operational-impact-postcondition:
    description: "Red impact makes the critical operational service unavailable."
    proposition: operational-service-available
    role: postcondition
    polarity: negative

objectives:
  defend-operational-service:
    description: "Blue preserves availability of the critical operational service."
    agent: blue
    actions: [sleep, monitor, analyse, remove, deploy-decoy, restore]
    targets: [op-server-0]
    success:
      mode: all_of
      assertions: [operational-service-invariant]
  impact-operational-service:
    description: "Red disrupts the critical operational service."
    agent: red
    actions: [discover-remote-systems, discover-network-services, exploit-remote-service, privilege-escalate, impact]
    targets: [op-server-0]
    success:
      mode: all_of
      assertions: [operational-impact-postcondition]

agents:
  blue:
    entity: blue-team
    description: "Blue defender with source-defined estate visibility and remediation actions."
    actions: [sleep, monitor, analyse, remove, deploy-decoy, restore]
    starting_accounts: [blue-defender, blue-enterprise-0, blue-enterprise-1, blue-enterprise-2, blue-op-host-0, blue-op-host-1, blue-op-host-2, blue-op-server-0, blue-user-0, blue-user-1, blue-user-2, blue-user-3, blue-user-4]
    initial_knowledge:
      hosts: [defender, enterprise-0, enterprise-1, enterprise-2, op-host-0, op-host-1, op-host-2, op-server-0, user-0, user-1, user-2, user-3, user-4]
      subnets: [user, enterprise, operational]
    observation_boundaries: [blue]
    allowed_subnets: [user, enterprise, operational]
    authority_anchors: [blue-team]
    operating_scope: [user, enterprise, operational]
  green:
    entity: green-workforce
    description: "Green workload participants on User and Operational hosts."
    actions: [sleep, green-ping-sweep, green-port-scan, green-connection]
    starting_accounts: [green-user-0, green-user-1, green-user-2, green-user-3, green-user-4, green-op-host-0, green-op-host-1, green-op-host-2]
