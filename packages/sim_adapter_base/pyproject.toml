[project]
name = "sim-adapter-base"
version = "0.0.0"
description = "Shared plumbing for ACES simulator adapters (skeleton; see ADR-001 / ACES ADR-069 §4)."
requires-python = ">=3.12"
# Intentionally no dependencies yet. sim_adapter_base consumes ACES published
# contracts and is NOT a semantic/protocol authority (ACES ADR-069 §4). Real
# dependencies and helpers land in REP-004.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_adapter_base"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.5",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sim_adapter_base"]

[tool.coverage.report]
show_missing = true
