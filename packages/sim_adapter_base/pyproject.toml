[project]
name = "sim-adapter-base"
version = "0.0.0"
description = "Shared plumbing for RAES simulator adapters (skeleton; see ADR-002 / RAES ADR-069 §4)."
requires-python = ">=3.12"
# RAES is the sole authority dependency, pinned exactly and resolved from PyPI
# in this package's own lock (ADR-002). sim_adapter_base consumes those published
# contracts and is NOT a semantic/protocol authority (RAES ADR-069 §4); its
# helpers land in REP-004.
dependencies = ["raes==2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_adapter_base"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.5",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sim_adapter_base"]

[tool.coverage.report]
show_missing = true
