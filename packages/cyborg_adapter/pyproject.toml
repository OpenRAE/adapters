[project]
name = "raes-adapter-cyborg"
version = "0.0.0"
description = "CybORG simulator backend adapter for RAES (skeleton; see ADR-002 / RAES ADR-069 §3)."
requires-python = ">=3.12"
# Depends on the shared base by workspace reference (ADR-069 §5: an adapter may
# depend on sim_adapter_base by version or path, but does NOT share one global
# lock). The concrete CybORG dependency + backend protocol implementations land
# under REP-004; the CAGE-2 mapping ledger content under REP-003.
dependencies = ["sim-adapter-base"]

[tool.uv.sources]
sim-adapter-base = { path = "../sim_adapter_base", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raes_adapter_cyborg"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.5",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["raes_adapter_cyborg"]

[tool.coverage.report]
show_missing = true
