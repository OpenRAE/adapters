site_name: RAES Adapters
site_description: Adapter implementations for reproducible agentic environments.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://raes-adapters.readthedocs.io/"]
repo_url: https://github.com/OpenRAE/adapters
repo_name: OpenRAE/adapters
edit_uri: edit/dev/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Researcher command: researcher-command.md
  - Maintainers:
      - Continuous integration: maintainers/ci.md
      - Project services: maintainers/project-services.md
  - Decisions:
      - Overview: decisions/adrs/README.md
      - Template: decisions/adrs/TEMPLATE.md
      - Shared simulator-adapter plumbing guardrails: decisions/base-plumbing-guardrails.md
      - CybORG/CAGE-2 backend qualification guardrails: decisions/cyborg-cage2-runtime-qualification-guardrails.md
      - CybORG/CAGE-2 source-ledger guardrails: decisions/cyborg-cage2-source-ledger-guardrails.md
      - CybORG/CAGE-2 provisioner and manifest guardrails: decisions/cyborg-cage2-provisioner-manifest-guardrails.md
      - CybORG logical-step and action-translation guardrails: decisions/cyborg-step-control-guardrails.md
      - CybORG participant episode and observation guardrails: decisions/cyborg-participant-runtime-guardrails.md
      - CybORG reward, objective, and outcome projection guardrails: decisions/cyborg-evaluation-projection-guardrails.md
      - CybORG conformance-composition guardrails: decisions/cyborg-conformance-guardrails.md
      - CybORG researcher run-and-evidence command guardrails: decisions/cyborg-researcher-command-guardrails.md
      - CyberBattleSim qualification guardrails: decisions/cyberbattlesim-qualification-guardrails.md
      - PrimAITE qualification guardrails: decisions/primaite-qualification-guardrails.md
      - PrimAITE scenario and source-ledger guardrails: decisions/primaite-scenario-ledger-guardrails.md
      - PrimAITE backend architecture guardrails: decisions/primaite-backend-guardrails.md
      - PrimAITE conformance-composition guardrails: decisions/primaite-conformance-guardrails.md
      - NASim qualification guardrails: decisions/nasim-qualification-guardrails.md
      - NASim scenario and source-ledger guardrails: decisions/nasim-scenario-ledger-guardrails.md
      - NASim backend architecture guardrails: decisions/nasim-backend-guardrails.md
      - NASim conformance-composition guardrails: decisions/nasim-conformance-guardrails.md
      - CyberBattleSim scenario and source-ledger guardrails: decisions/cyberbattlesim-scenario-ledger-guardrails.md
      - CyberBattleSim backend architecture guardrails: decisions/cyberbattlesim-backend-guardrails.md
      - CyberBattleSim conformance-composition guardrails: decisions/cyberbattlesim-conformance-guardrails.md
      - ADR 003 — Single distribution and Trusted Publishing: decisions/adrs/adr-003-single-distribution-and-trusted-publishing.md
      - ADR 002 — RAES authority and adapter boundaries: decisions/adrs/adr-002-raes-authority-and-adapter-boundaries.md
      - ADR 000 — Use ADRs (superseded): decisions/adrs/adr-000-use-adrs.md
      - ADR 001 — Adapter monorepo standup (superseded): decisions/adrs/adr-001-adapters-monorepo-standup.md
