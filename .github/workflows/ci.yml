name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One distribution, one verification graph: hygiene, lint, governance policy,
  # tool tests, typecheck, tests, the build/clean-install identity proof, and the
  # strict docs build. `raes-adapters` is a single package with optional
  # per-simulator extras, so there is no per-adapter matrix.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
      - name: Resolve requirement UID from branch
        id: requirement
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REQ_UID="$(printf '%s\n' "$BRANCH" | grep -oE '[A-Z]{3}-[0-9]{3}' | head -n1 || true)"
          echo "Resolved branch='$BRANCH' uid='$REQ_UID'"
          echo "uid=$REQ_UID" >> "$GITHUB_OUTPUT"
      - name: Canonical verification graph
        run: |
          policy_args=()
          if [ -n "${{ steps.requirement.outputs.uid }}" ]; then
            policy_args+=(--requirement-uid "${{ steps.requirement.outputs.uid }}")
          else
            policy_args+=(--skip-requirement)
          fi
          uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s verify -- "${policy_args[@]}"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pr-gate:
    name: PR Gate
    needs: [verify, sonar]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert required PR jobs passed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::Verify did not succeed ($VERIFY_RESULT)"
            exit 1
          fi
          if [ "$SAME_REPOSITORY" = "true" ] && [ "$SONAR_RESULT" != "success" ]; then
            echo "::error::SonarCloud did not succeed for a same-repository PR ($SONAR_RESULT)"
            exit 1
          fi
          if [ "$SAME_REPOSITORY" != "true" ] && [ "$SONAR_RESULT" != "skipped" ]; then
            echo "::error::SonarCloud must be skipped for a fork PR ($SONAR_RESULT)"
            exit 1
          fi
          echo "Required PR jobs passed"
