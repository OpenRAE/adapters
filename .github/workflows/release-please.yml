name: Release Please

# On each push to `main` release-please maintains a "chore(main): release X.Y.Z"
# PR that bumps [project].version in pyproject.toml and updates CHANGELOG.md from
# the Conventional Commits since the last release. Merging that PR tags `vX.Y.Z`
# and cuts the GitHub Release; the build + publish jobs then build the wheel and
# sdist and publish `raes-adapters` to PyPI over OIDC Trusted Publishing (no
# stored token), and a back-merge PR resyncs `dev`.
#
# Feature PRs never touch CHANGELOG.md — release-please owns it — so there are no
# fragment collisions. `raes_adapters.__version__` derives from installed
# distribution metadata. First release + PyPI setup: docs/maintainers/releasing.md.
#
# Caveat: the release PR is opened by GITHUB_TOKEN, so required CI checks do not
# auto-run on it — admin-merge it, or give release-please a PAT so checks run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/maintain the release PR, tag, and Release
      pull-requests: write    # maintain the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # Prefer RELEASE_PLEASE_TOKEN (a GitHub App token or fine-grained PAT with
          # contents + pull-requests write) so the release PR triggers the required
          # checks instead of needing an administrative merge; falls back to the
          # built-in token until that secret is provisioned. See
          # docs/maintainers/project-services.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build is separate from publish (ADR-003): the publishing identity never sees
  # build/test code. This job builds the exact released commit, validates the
  # artifacts, records checksums, and hands only those files to the publish job.
  build:
    needs: release-please
    if: >-
      always()
      && (needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a release tag such as v0.1.0, got '${TAG}'" >&2; exit 1 ;;
          esac
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      - name: Require the dispatched tag to be on protected main
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `gh release view` only proves a Release exists — not that its commit
          # came through protected `main`. Refuse to publish a tag that is not
          # reachable from protected origin/main, so a write-access account that
          # cannot merge to main cannot push a tag + Release and dispatch a
          # publish of an unreviewed commit.
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_sha}" origin/main; then
            echo "::error::tag ${TAG} (${tag_sha}) is not reachable from protected origin/main; refusing to publish an unreviewed commit" >&2
            exit 1
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
      - name: Bind the release identity (package version == release tag)
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::package version v${version} does not match release tag ${TAG}; refusing to build or publish a mismatched identity" >&2
            exit 1
          fi
      - name: Canonical verification graph (gate the released commit)
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s verify -- --skip-requirement
      - name: Build wheel + sdist (reproducible)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: uv build --out-dir dist
      - name: Validate distribution metadata and README rendering
        run: uvx --from twine twine check --strict dist/*
      - name: Record checksums (outside the package directory)
        # SHA256SUMS must NOT live in dist/: the whole dist/ is handed to the PyPI
        # publisher as packages-dir, and a non-distribution file there fails upload.
        run: sha256sum dist/* | tee SHA256SUMS
      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # attach the built distributions to the GitHub Release
      id-token: write   # OIDC Trusted Publishing to PyPI (no stored token)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Download checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checksums
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          # PyPA publish attestations (PEP 740) are generated by default over
          # OIDC. `skip-existing` is deliberately NOT set: a duplicate or
          # conflicting upload is a hard stop, never a silent skip, so a partial
          # or repeated release can never be reported as success.
      - name: Attach distributions and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        # No --clobber: a released version's assets are immutable (ADR-003), so an
        # attempt to replace existing assets must fail rather than overwrite.
        run: gh release upload "${TAG}" dist/* SHA256SUMS

  # Prove the published artifact installs and imports from the public index in a
  # clean environment (no checkout, no local links).
  smoke:
    needs: [release-please, publish]
    if: >-
      always()
      && needs.publish.result == 'success'
      && (needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install exact released version from PyPI and import
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python -m venv /tmp/smoke
          for attempt in 1 2 3 4 5 6; do
            if /tmp/smoke/bin/pip install --no-cache-dir "raes-adapters[cyborg]==${VERSION}"; then
              break
            fi
            echo "attempt ${attempt}: version not yet on the index; waiting"
            sleep 20
          done
          /tmp/smoke/bin/python - <<'PY'
          import raes_adapters
          import raes_adapters.base
          import raes_adapters.cyborg
          from importlib.metadata import version
          print("smoke ok", raes_adapters.__version__)
          assert raes_adapters.__version__ == version("raes-adapters")
          PY
          test "$(/tmp/smoke/bin/python -c 'import raes_adapters; print(raes_adapters.__version__)')" = "${VERSION}"

  # After a release, the version bump + CHANGELOG land on `main`, so `dev` falls
  # one release commit behind. Open a back-merge PR so `dev` is resynced. This job
  # never merges it or force-updates a protected branch.
  sync-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open the back-merge PR (main -> dev)
        env:
          # Same token preference as the release PR: with RELEASE_PLEASE_TOKEN the
          # back-merge PR triggers dev's required checks instead of an admin merge.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base dev --head main --state open --json number --jq '.[].number')"
          if [ -n "${existing}" ]; then
            echo "back-merge PR main->dev already open (#${existing}); nothing to do"
            exit 0
          fi
          gh pr create --repo "${GITHUB_REPOSITORY}" --base dev --head main \
            --title "chore: back-merge ${TAG} into dev" \
            --body "Automated back-merge of the ${TAG} release commit (version bump + CHANGELOG) from \`main\` into \`dev\`, so \`dev\` stays in sync. \`main\` is ahead of \`dev\` only by the release commit. \`dev\`'s required checks do not run on this bot-opened PR — merge it directly (admin)."
